spring:
  application:
    name: order-pricing-engine
  cache:
    type: caffeine
  datasource:
    url: jdbc:postgresql://localhost:5432/order_engine
    username: root
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

---
# Local dev: in-process Caffeine cache (no Redis required)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pricing_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true

---
# Production / multi-instance: shared Redis cache
spring:
  config:
    activate:
      on-profile: redis
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
